<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đã gửi yêu cầu | PlayNest</title>
    <link rel="shortcut icon" href="assets/img/favicon.svg?v=playnest-4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600;700&display=swap&subset=vietnamese" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #fff;
            background: #090d12;
            font-family: "Saira Semi Condensed", sans-serif;
        }
        .thank-you-card {
            width: min(620px, 100%);
            padding: 54px 32px;
            text-align: center;
            border: 1px solid rgba(249, 94, 0, .55);
            background: linear-gradient(145deg, rgba(249, 94, 0, .13), rgba(255, 255, 255, .025));
        }
        .thank-you-card img { width: min(230px, 70%); margin-bottom: 34px; }
        .thank-you-card h1 { margin: 0 0 14px; font-size: clamp(34px, 7vw, 54px); line-height: 1; }
        .thank-you-card p { margin: 0 auto 30px; max-width: 470px; color: #c8c8c8; font-size: 18px; }
        .thank-you-card a {
            display: inline-block;
            padding: 13px 28px;
            color: #fff;
            background: #f95e00;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
        }
        .thank-you-card a:hover { background: #d95000; }
    </style>
</head>
<body>
    <main class="thank-you-card">
        <img src="assets/img/logo/footer-logo.svg" alt="PlayNest">
        <h1>Đã gửi yêu cầu!</h1>
        <p>PlayNest đã nhận được thông tin và sẽ liên hệ với bạn trong thời gian sớm nhất.</p>
        <a href="index.html">Quay về trang chủ</a>
    </main>
</body>
</html>
