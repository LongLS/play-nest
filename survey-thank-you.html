<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Cảm ơn bạn đã gửi đánh giá cho PlayNest.">
    <title>Cảm ơn bạn đã đánh giá | PlayNest</title>
    <link rel="shortcut icon" href="assets/img/favicon.svg?v=playnest-4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600;700;800&amp;display=swap&amp;subset=vietnamese" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --playnest-orange: #f95e00;
            --playnest-bg: #090d12;
            --playnest-card: #11171e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            padding: 32px 20px;
            color: #fff;
            background:
                radial-gradient(circle at 10% 10%, rgba(249, 94, 0, .15), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(249, 94, 0, .08), transparent 30%),
                var(--playnest-bg);
            font-family: "Saira Semi Condensed", sans-serif;
        }
        .survey-success {
            position: relative;
            width: min(760px, 100%);
            overflow: hidden;
            padding: clamp(38px, 7vw, 72px) clamp(24px, 7vw, 68px);
            border: 1px solid rgba(249, 94, 0, .48);
            border-top: 5px solid var(--playnest-orange);
            text-align: center;
            background: linear-gradient(145deg, var(--playnest-card), #0b1016);
            box-shadow: 0 32px 100px rgba(0, 0, 0, .42);
        }
        .survey-success::before,
        .survey-success::after {
            position: absolute;
            border: 36px solid rgba(249, 94, 0, .07);
            border-radius: 50%;
            content: "";
        }
        .survey-success::before {
            top: -110px;
            right: -90px;
            width: 250px;
            height: 250px;
        }
        .survey-success::after {
            bottom: -130px;
            left: -110px;
            width: 290px;
            height: 290px;
        }
        .survey-success__logo {
            position: relative;
            z-index: 1;
            width: min(215px, 68%);
            margin-bottom: 34px;
        }
        .survey-success__icon {
            position: relative;
            z-index: 1;
            display: grid;
            width: 82px;
            height: 82px;
            margin: 0 auto 26px;
            place-items: center;
            border: 1px solid rgba(249, 94, 0, .55);
            border-radius: 50%;
            color: #090d12;
            background: var(--playnest-orange);
            box-shadow: 0 0 0 10px rgba(249, 94, 0, .09);
            font-size: 38px;
            font-weight: 800;
        }
        .survey-success__eyebrow {
            position: relative;
            z-index: 1;
            display: block;
            margin-bottom: 12px;
            color: var(--playnest-orange);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h1 {
            position: relative;
            z-index: 1;
            margin: 0 0 18px;
            font-size: clamp(38px, 8vw, 64px);
            line-height: 1;
        }
        p {
            position: relative;
            z-index: 1;
            max-width: 570px;
            margin: 0 auto 34px;
            color: #c3c8cd;
            font-size: clamp(17px, 3vw, 20px);
            line-height: 1.7;
        }
        .survey-success__actions {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .survey-success__actions a {
            display: inline-flex;
            min-height: 52px;
            padding: 12px 26px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--playnest-orange);
            color: #090d12;
            background: var(--playnest-orange);
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            transition: color .2s ease, background .2s ease;
        }
        .survey-success__actions a:last-child {
            color: #fff;
            background: transparent;
        }
        .survey-success__actions a:hover {
            color: #090d12;
            background: #fff;
            border-color: #fff;
        }
        @media (max-width: 575px) {
            body { padding: 16px; }
            .survey-success { padding: 38px 20px; }
            .survey-success__logo { margin-bottom: 28px; }
            .survey-success__icon { width: 70px; height: 70px; font-size: 32px; }
            .survey-success__actions { align-items: stretch; flex-direction: column; }
            .survey-success__actions a { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="survey-success">
        <img class="survey-success__logo" src="assets/img/logo/footer-logo.svg" alt="PlayNest">
        <div class="survey-success__icon" aria-hidden="true">✓</div>
        <span class="survey-success__eyebrow">Đánh giá đã được gửi</span>
        <h1>Cảm ơn bạn!</h1>
        <p>Mỗi chia sẻ của bạn đều giúp PlayNest hiểu khách hàng hơn, cải thiện dịch vụ và mang đến những lần trải nghiệm vui hơn, thoải mái hơn.</p>
        <div class="survey-success__actions">
            <a href="index.html">Về trang chủ</a>
            <a href="game.html">Khám phá danh sách game</a>
        </div>
    </main>
</body>
</html>
